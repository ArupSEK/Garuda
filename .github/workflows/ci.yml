name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          python -m ruff check .
          python -m compileall -q app dashboard tests
          python -c "from app.main import app; assert app.openapi()['paths']"
      - name: Unit tests
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Validate Compose model
        env:
          SECRET_KEY: ci-validation-only
        run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build scanner appliance
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: garuda-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair an empty application secret
        shell: powershell
        run: |
          Set-Content -LiteralPath .env -Value "SECRET_KEY=" -Encoding ascii
          & .\scripts\ensure_env.ps1 -ProjectRoot $PWD.Path
          $Secret = (Select-String -LiteralPath .env -Pattern '^SECRET_KEY=(.+)$').Matches[0].Groups[1].Value
          if ($Secret.Length -lt 32) { throw "SECRET_KEY was not repaired" }
          $FirstSecret = $Secret
          & .\scripts\ensure_env.ps1 -ProjectRoot $PWD.Path
          $SecondSecret = (Select-String -LiteralPath .env -Pattern '^SECRET_KEY=(.+)$').Matches[0].Groups[1].Value
          if ($SecondSecret -ne $FirstSecret) { throw "Valid SECRET_KEY was unexpectedly replaced" }
